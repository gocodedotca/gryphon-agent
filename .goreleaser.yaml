# Releases of the Linux and Windows agent, built by .github/workflows/release.yml
# when a v* tag is pushed, as a draft to look over and publish by hand.
#
#   goreleaser release --snapshot --clean   # try it locally, publishes nothing
#
# The container image, for running the agent inside a Kubernetes cluster, goes
# to ghcr.io/gocodedotca/gryphon-agent:<version> for amd64 and arm64, and the
# manifests in deploy/kubernetes are attached to the release with that version
# filled in. The image is pushed when the release is built, draft or not.
#
# The Mac agent is a notarized DMG, signed on a Mac and attached to the same
# release by hand; the Homebrew cask (deploy/homebrew) is built from its URL.
# The release goes to the repository this runs in, which is where install.sh,
# the Mac app's update check and the cask all look.
version: 2
project_name: gryphon-agent

before:
  hooks:
    - go mod download
    # The Kubernetes manifests, with the image's version in place of
    # __VERSION__, for release.extra_files below. Pinned to this release, so
    # the manifest and the image it names cannot drift apart.
    - >-
      sh -c 'rm -rf build/k8s-release && mkdir -p build/k8s-release &&
      for f in deploy/kubernetes/*.yaml; do
      sed "s/__VERSION__/{{ .Version }}/" "$f" > "build/k8s-release/$(basename "$f")"; done'

builds:
  - id: client
    main: ./cmd/client
    binary: gryphon-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/gocodedotca/gryphon-agent/pkg/version.Override={{.Tag}}
  - id: client-windows
    main: ./cmd/client
    binary: gryphon-agent
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/gocodedotca/gryphon-agent/pkg/version.Override={{.Tag}}

archives:
  # The archive carries the unit and scripts, because install.sh installs
  # from it. Its name is what install.sh asks for.
  - id: client
    ids: [client]
    name_template: "gryphon-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - deploy/agent/*
  # Windows: the program, which installs itself as a service
  # (gryphon-agent service install), and the README that says how.
  - id: client-windows
    ids: [client-windows]
    name_template: "gryphon-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE
      - README.md

# The image is the Linux binary on distroless/static; deploy/kubernetes/Dockerfile
# says why that base. One multi-platform image under the plain version, which
# is what gryphon-agent.yaml names.
dockers_v2:
  - id: image
    ids: [client]
    dockerfile: deploy/kubernetes/Dockerfile
    images: ["ghcr.io/gocodedotca/gryphon-agent"]
    tags: ["{{ .Version }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/gocodedotca/gryphon-agent
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.description: Gryphon agent, for watching a Kubernetes cluster from inside it

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

nfpms:
  - id: client
    ids: [client]
    package_name: gryphon-agent
    file_name_template: "gryphon-agent_{{ .Version }}_{{ .Arch }}"
    vendor: Gryphon
    homepage: https://github.com/gocodedotca/gryphon-agent
    maintainer: Trevor Sawler <trevor.sawler@gmail.com>
    description: Gryphon client agent, measuring a host for the Gryphon monitoring server.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: deploy/agent/gryphon-agent.service
        dst: /usr/lib/systemd/system/gryphon-agent.service
      - src: deploy/agent/agent.env
        dst: /etc/gryphon/agent.env
        type: config|noreplace
        file_info:
          # Root's only: it can hold a proxy's credentials in HTTPS_PROXY,
          # and only systemd, as root, reads it.
          mode: 0600
      - src: deploy/agent/docker-socket-proxy.yml
        dst: /usr/share/doc/gryphon-agent/docker-socket-proxy.yml
    scripts:
      postinstall: deploy/agent/postinstall.sh
      preremove: deploy/agent/preremove.sh

release:
  # A tag on the wrong commit is a mistake to catch, not a release.
  draft: true
  prerelease: auto
  # The Kubernetes manifests the before hook filled in. Gryphon's install
  # page and host page link them at releases/download/v<version>/.
  extra_files:
    - glob: ./build/k8s-release/*.yaml

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
