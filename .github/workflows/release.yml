# Builds the Linux and Windows agent release when a v* tag is pushed, as a
# draft GitHub release to be looked over and published by hand, once the tests
# have passed on Linux and macOS (test.yml says why not Windows, for now).
# .goreleaser.yaml says what is built. The signed Mac DMG is attached to the
# same release by hand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The container image goes to ghcr.io/gocodedotca/gryphon-agent.
  packages: write

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    uses: ./.github/workflows/test.yml

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The image is built for amd64 and arm64 on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned: the image is built with dockers_v2, which goreleaser
          # still calls experimental. Move this on deliberately, after
          # `goreleaser release --snapshot --clean` passes with the new one.
          version: "v2.12.7"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
