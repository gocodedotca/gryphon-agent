# The tests on Linux, macOS and Windows, on every push and pull request, and
# before every release (release.yml calls this). Each system has code of its
# own -- the Windows service and script rules, the Unix process groups, the
# Mac app -- that only its own runner exercises.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
