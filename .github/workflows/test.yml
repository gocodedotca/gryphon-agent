# The tests on Linux and macOS, on every push and pull request, and before
# every release (release.yml calls this). Each system has code of its own --
# the Unix process groups, the Mac app -- that only its own runner exercises.
#
# The Windows runner is off for now: several tests assert that a round trip
# took more than zero, and Go's clock on Windows moves in ticks of up to
# 15.6ms, so loopback checks there measure 0s and fail at random
# (TestTCPCheck, the netcheck handshakes). Until those tests are fixed, the
# Windows code is only vetted, cross-compiled from Linux.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - run: go test ./...
