# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# The Gryphon agent. This repository is exported from the Gryphon server's,
# where the agent is developed; changes made here directly are overwritten by
# the next export.

version: '3'

tasks:
    default:
      silent: true
      cmds:
        - task --list

    test:
      desc: Run the tests
      cmds:
        - go test ./...

    build-client:
      desc: 'Build the headless agent at tmp/gowatcher-client (linux/amd64; override: task build-client OS=darwin ARCH=arm64)'
      vars:
        OS: '{{.OS | default "linux"}}'
        ARCH: '{{.ARCH | default "amd64"}}'
      cmds:
        - mkdir -p tmp
        - >-
          CGO_ENABLED=0 GOOS={{.OS}} GOARCH={{.ARCH}}
          go build -trimpath -ldflags="-s -w" -o tmp/gowatcher-client ./cmd/client

    build-client-mac:
      desc: 'Build the menu bar agent, "tmp/Gryphon Agent.app", universal and ad-hoc signed for local testing'
      cmds:
        - build/macos/package.sh dev
